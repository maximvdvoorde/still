<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Still – level overview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#4A4642}a:hover{color:#2F2C29}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F1E9; font-family: ui-rounded, -apple-system, system-ui, sans-serif; display: flex; flex-direction: column; padding: 64px 24px 56px">
<div style="display: flex; align-items: center; gap: 8px">
<button aria-label="Back to game" style="width: 44px; height: 44px; border: none; background: none; padding: 0; display: flex; align-items: center; justify-content: center; color: #8A837B"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 6l-6 6 6 6"/></svg></button>
<h1 style="margin: 0; font-size: 22px; font-weight: 500; color: #4A4642">Levels</h1>
<span style="margin-left: auto; font-size: 13px; color: #6F6862">11 of 30</span>
</div>
<div style="flex: 1"></div>
<div style="display: flex; flex-direction: column; gap: 40px; padding: 0 12px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 8px">
<span style="font-size: 13px; color: #6F6862">{{g.name}}</span>
<div aria-hidden="true" style="flex: 1; height: 1px; background: rgba(138,131,123,0.2)"></div>
</div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); row-gap: 20px; justify-items: center">
<sc-for list="{{g.levels}}" as="lv" hint-placeholder-count="10">
<div role="img" aria-label="{{lv.label}}" style="{{lv.style}}"></div>
</sc-for>
</div>
</div>
</sc-for>
</div>
<div style="flex: 1.3"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const colors = ['#C0704F', '#5B7FA0', '#A57A22', '#5F7F76', '#9A6A8C', '#BC6670'];
const base = 'width: 38px; height: 38px; border-radius: 50%; box-sizing: border-box; ';
const names = ['Easy', 'Medium', 'Tricky'];
const groups = names.map((name, gi) => {
const levels = [];
for (let k = 1; k <= 10; k++) {
const i = gi * 10 + k;
let style, label;
if (i < 12) { style = base + 'background: #5F7F76'; label = 'Level ' + i + ', solved'; }
else if (i === 12) { style = base + 'border: 2.5px solid #5F7F76; box-shadow: 0 0 0 5px rgba(95,127,118,0.15)'; label = 'Level 12, next up'; }
else { style = base + 'border: 1.5px solid rgba(138,131,123,0.45)'; label = 'Level ' + i; }
levels.push({ style: style, label: label });
}
return { name: name, levels: levels };
});
return { groups: groups };
}
}
</script>
</body>
</html>
